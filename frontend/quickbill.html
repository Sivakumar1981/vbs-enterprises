<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1a0f00"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/images/VBS_logo.png"/>
<title>VBS Quick Bill</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f6efe4;color:#1a0f00;font-family:'Noto Sans Tamil','Noto Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}  /* 16px stops zoom-on-focus */

/* top bar */
.top{background:#1a0f00;color:#e8c068;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.3px;flex:1;min-width:120px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#888}
.dot.on{background:#3ddc84}.dot.off{background:#ff6b5e}
.pill{border:1px solid #6b5230;background:#2a1a05;color:#e8c068;border-radius:999px;padding:6px 11px;font-size:.8rem;font-weight:600}
.pill.ok{background:#0a7d33;border-color:#0a7d33;color:#fff}
.sync{display:none;background:#c8902a;color:#1a0f00;border:none;border-radius:999px;padding:6px 11px;font-size:.78rem;font-weight:700}
.ic{background:none;border:none;color:#e8c068;font-size:1.25rem;padding:4px 6px}

/* search + categories */
.bar{padding:8px 10px 4px;background:#f6efe4}
.bar input{width:100%;padding:11px 14px;border:1.5px solid #dcc9a6;border-radius:12px;background:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 8px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid #dcc9a6;background:#fff;color:#5a4325;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem}
.chip.on{background:#c8902a;border-color:#c8902a;color:#fff}

/* product grid */
.ti{height:86px;border-radius:10px;overflow:hidden;background:#f3e9d6;position:relative;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:7px}
.ti img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ti.noimg img{display:none}
.qb,.mn{display:none}
.tile.in{border-color:#0a9d3f;background:#f1fbf3}
.tile.in .qb{display:flex;position:absolute;top:6px;left:6px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:#0a9d3f;color:#fff;font-weight:800;align-items:center;justify-content:center;font-size:.95rem;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tile.in .mn{display:flex;position:absolute;right:6px;top:56px;width:38px;height:38px;border-radius:50%;border:none;background:#d93025;color:#fff;font-size:1.6rem;font-weight:800;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tb{min-width:0}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 10px 190px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:#fff;border:1.5px solid #e6d6b8;border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;user-select:none;touch-action:manipulation;transition:transform .08s}
.tile:active{transform:scale(.96);background:#fff4dc;border-color:#c8902a}
.tn{font-weight:700;font-size:.95rem;line-height:1.2}
.tt{font-size:.85rem;color:#7a5a2a;margin-top:2px}
.tp{font-weight:800;color:#0a7d33;margin-top:6px}
.edit{position:absolute;top:4px;right:4px;border:none;background:rgba(255,255,255,.85);border-radius:8px;font-size:.8rem;opacity:.7;padding:3px 5px}
.edit.warn{opacity:1}
.empty{text-align:center;color:#9a8460;padding:26px 10px;grid-column:1/-1}
.hint{font-size:.74rem;color:#8a7552}

/* bottom dock + cart sheet */
.dock{position:fixed;left:0;right:0;bottom:0;background:#1a0f00;color:#fff;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;z-index:30;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.pay{display:flex;gap:8px;width:100%}
.pb{flex:1;border:1.5px solid #6b5230;background:#2a1a05;color:#e8c068;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.9rem}
.pb.on{background:#c8902a;border-color:#e8c068;color:#1a0f00}
.dock-info{flex:1;min-width:0;background:none;border:none;color:#fff;text-align:left;padding:2px 4px}
.dock-info small{display:block;color:#c9b48a;font-size:.78rem}
.dock-info b{font-size:1.5rem;color:#e8c068}
.print{background:#0a9d3f;color:#fff;border:none;border-radius:14px;padding:16px 22px;font-size:1.15rem;font-weight:800;letter-spacing:.5px;min-width:140px}
.print:disabled{background:#555;color:#999}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;background:#fff8f0;border-radius:18px 18px 0 0;z-index:20;transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-bottom:140px;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet.open{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;font-weight:800}
.lines{overflow-y:auto;padding:0 12px;flex:1;-webkit-overflow-scrolling:touch}
.ln{background:#fff;border:1.5px solid #ecdcc0;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.ln-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ln-name{font-weight:700;line-height:1.25}.ln-name small{color:#7a5a2a;font-weight:500}
.x{border:none;background:#f3e3e0;color:#b3261e;border-radius:8px;width:30px;height:30px;font-weight:800}
.ln-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.step{display:flex;align-items:center;border:1.5px solid #dcc9a6;border-radius:10px;overflow:hidden}
.step button{width:38px;height:38px;border:none;background:#f6efe4;font-size:1.3rem;font-weight:800;color:#5a4325}
.step input{width:56px;height:38px;text-align:center;border:none;border-left:1px solid #e6d6b8;border-right:1px solid #e6d6b8;font-weight:700}
.mul{color:#8a7552}
.rate{width:84px;height:38px;border:1.5px solid #dcc9a6;border-radius:10px;padding:0 8px;font-weight:700}
.amt{margin-left:auto;font-weight:800;font-size:1.02rem}
.sh-foot{padding:6px 14px 4px}
.final{display:flex;gap:8px;align-items:center}
.final input{flex:1;padding:10px 12px;border:1.5px solid #c8902a;border-radius:10px;font-weight:700}
.tax{font-size:.78rem;color:#5a4325;margin-top:6px;line-height:1.45}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border:none;border-radius:10px;padding:11px;font-weight:700;background:#efe2c8;color:#5a4325}
.btn.pri{background:#c8902a;color:#fff}.btn.red{background:#f3e3e0;color:#b3261e}
.btn:disabled{opacity:.45}

/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.card{background:#fff8f0;width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center}.card{border-radius:18px}}
.card h3{margin:0 0 10px}
.fld{margin-bottom:11px}.fld label{display:block;font-size:.8rem;font-weight:700;color:#5a4325;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;border:1.5px solid #dcc9a6;border-radius:10px;background:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:11px}.chk input{width:20px;height:20px}
.pvsheet{background:#fff;max-width:420px;margin:0 auto;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.pvimg{display:block;max-width:100%;image-rendering:pixelated}
.pvtxt{background:#fff;padding:0;font:11.5px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:0}
.rc{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #ecdcc0}
.rc-r{text-align:right}.tag{font-size:.7rem;background:#efe2c8;color:#5a4325;border-radius:6px;padding:1px 6px;font-weight:700}
.rcb{display:flex;gap:6px;justify-content:flex-end}
.mini.red{background:#d93025}
.chk2{display:inline-flex;align-items:center;gap:6px;margin:0 12px 8px 0;font-weight:600}.chk2 input{width:18px;height:18px}
.mini{display:block;margin-top:4px;border:none;background:#2a62c8;color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.78rem}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:#1a0f00;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:all .2s;max-width:90%;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#b3261e}
</style>
</head>
<body>

<div class="top">
  <div class="brand">⚡ VBS Quick Bill</div>
  <span class="dot" id="net" title="Online"></span>
  <button class="sync" id="sync"></button>
  <button class="pill" id="prn">🖨 Connect</button>
  <button class="ic" id="recentBtn" title="Recent bills">🧾</button>
  <button class="ic" id="setBtn" title="Settings">⚙️</button>
</div>

<div class="bar"><input id="q" type="search" placeholder="Search product… / தேடுக" autocomplete="off"/></div>
<div class="cats" id="cats"></div>

<div class="main">
  <div class="grid" id="grid"></div>
  <div style="text-align:center;margin-top:14px"><button class="chip" id="customBtn">➕ Other item (type name &amp; price)</button></div>
</div>

<!-- bill sheet -->
<div class="sheet" id="sheet">
  <div class="sh-head"><span>🧾 Current bill</span><button class="ic" style="color:#5a4325" id="closeSheet">✕</button></div>
  <div class="lines" id="lines"></div>
  <div class="sh-foot">
    <div class="final"><span style="font-weight:700;white-space:nowrap">Final total ₹</span>
      <input id="finalTotal" type="number" inputmode="decimal" step="any" min="0" placeholder="optional – GST is taken out of this"/></div>
    <div class="tax" id="taxInfo"></div>
    <div class="row">
      <button class="btn" id="previewBtn">👁 Preview</button>
      <button class="btn red" id="clearBtn">Clear</button>
    </div>
  </div>
</div>

<!-- always-visible dock -->
<div class="dock">
  <div class="pay" id="pay">
    <button class="pb on" data-pay="cash">💵 Cash</button>
    <button class="pb" data-pay="upi">📱 UPI</button>
    <button class="pb" data-pay="card">💳 Card</button>
  </div>
  <button class="dock-info" id="dockInfo"><small id="sumCount">No items</small><b id="sumTotal">₹0.00</b></button>
  <button class="print" id="printBtn" disabled>🖨 PRINT</button>
</div>

<!-- preview / reprint -->
<div class="modal" id="pv"><div class="card">
  <h3>Bill preview</h3><div id="pvBody"></div>
  <div class="row"><button class="btn" data-close="pv">Close</button><button class="btn pri" id="pvPrint">🖨 Print</button></div>
</div></div>

<!-- edit names -->
<div class="modal" id="ed"><div class="card">
  <h3>Bill names</h3>
  <div class="hint" style="margin-bottom:10px">Full name: <b id="edFull"></b></div>
  <div class="fld"><label>Short English name (printed on bill)</label><input id="edShort" maxlength="30" placeholder="e.g. GN Oil 1L"/></div>
  <div class="fld"><label>Tamil name (printed on bill)</label><input id="edTa" maxlength="40" placeholder="எ.கா. கடலை எண்ணெய் 1L"/></div>
  <div class="row"><button class="btn" data-close="ed">Cancel</button><button class="btn pri" id="edSave">Save</button></div>
</div></div>

<!-- login -->
<div class="modal" id="lg"><div class="card">
  <h3>🔐 Admin login</h3>
  <div class="hint" style="margin-bottom:10px">Needed only to save bills &amp; names to the server. Printing works without it.</div>
  <div class="fld"><label>Username</label><input id="lgUser" autocomplete="username"/></div>
  <div class="fld"><label>Password</label><input id="lgPass" type="password" autocomplete="current-password"/></div>
  <div class="row"><button class="btn" id="lgSkip">Skip for now</button><button class="btn pri" id="lgBtn">Login</button></div>
</div></div>

<!-- recent bills -->
<div class="modal" id="rc"><div class="card">
  <h3>Recent bills</h3><div class="hint" id="rcSum" style="margin-bottom:6px"></div>
  <div id="rcList"></div>
  <div class="row"><button class="btn" data-close="rc">Close</button></div>
</div></div>

<!-- settings -->
<div class="modal" id="st"><div class="card">
  <h3>⚙️ Settings</h3>
  <div class="fld"><label>Paper width</label>
    <select id="sWidth"><option value="576">80 mm (576 dots)</option><option value="512">80 mm – narrow (512)</option><option value="384">58 mm (384 dots)</option></select></div>
  <div class="fld"><label>Language on bill</label>
    <select id="sLang"><option value="both">Tamil + English (fast hybrid)</option><option value="tamil">Tamil only</option><option value="english">English only – FASTEST (printer's own text)</option></select></div>
  <div class="fld"><label>Print method</label>
    <select id="sMethod"><option value="ble">Bluetooth (direct from Chrome)</option><option value="rawbt">RawBT app</option></select></div>
  <div class="fld"><label>Bluetooth speed (lower it if the bill prints garbled)</label>
    <select id="sSpeed"><option value="turbo">Turbo (try first; may garble on some printers)</option><option value="fast">Fast</option><option value="normal">Normal</option><option value="safe">Safe / slow</option></select></div>
  <div class="fld"><label>Total GST % (split equally into CGST + SGST)</label><input id="sGst" type="number" inputmode="decimal" step="any"/></div>
  <div class="fld"><label>Bill number prefix (use a different letter on each phone)</label><input id="sPrefix" maxlength="6"/></div>
  <div class="fld"><label>Show these product groups in Quick Bill (tick = show)</label><div id="sCats"></div></div>
  <div class="row"><button class="btn pri" data-close="st">Done</button></div>
</div></div>

<div id="toast"></div>
<script src="js/quickbill.js?v=3"></script>
</body>
</html>
